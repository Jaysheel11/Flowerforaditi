(() => {
  if (!window.THREE) { document.getElementById('loading').textContent = 'Could not load. Check your internet and refresh.'; return; }

  /* ---------- seeded randomness ---------- */
  function hashStr(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
    h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function rngFor(key) {
    let a = hashStr(SEED_WORD + '|' + key);
    const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    r.range = (x, y) => x + r() * (y - x);
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    r.int = (x, y) => Math.floor(x + r() * (y - x + 1));
    return r;
  }
  const pickName = r => r() < 0.55 ? NAMES[0] : r.pick(NAMES);

  /* ---------- dates ---------- */
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const dayNumber = d => Math.round((d - fromKey(START_DATE)) / 86400000) + 1;
  const longDate = d => d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const shortDate = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  function allDays() {
    const out = [], t = today();

    const big = f.kind === 'sunflower', spike = f.kind === 'spike';
    const headY = spike ? r.range(1.25, 1.45) : big ? 2.0 : r.range(1.7, 1.95);
    const top = new THREE.Vector3(r.range(-0.12, 0.12), headY, r.range(-0.08, 0.08));
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(r.range(-0.15, 0.15), headY * 0.45, r.range(-0.1, 0.1)), top]);
    const stemMat = std('#2f7a46', 0.65);
    flower.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 40, big ? 0.045 : 0.028, 8, false), stemMat));
    const leafCols = ['#173f25', '#2f7a46', '#58b073'], longLeaf = ['tulip', 'iris', 'spike', 'calla', 'lily'].includes(f.kind);
    const nLeaves = longLeaf ? 2 : r.int(1, 3);
    for (let i = 0; i < nLeaves; i++) {
      const t = 0.12 + i * 0.22 + r.range(0, 0.08), p = curve.getPoint(t);
      const pivot = new THREE.Group(); pivot.position.copy(p); pivot.rotation.y = i * 2.4 + r.range(0, 1);
      const m = new THREE.Mesh(petalGeo({ len: longLeaf ? 1.0 : 0.72, wid: longLeaf ? 0.16 : 0.2, cup: 0.3, bend: longLeaf ? 0.12 : -0.2, point: 1, colors: leafCols }, r),
        new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.55 }));
      m.rotation.x = -(longLeaf ? 1.15 : r.range(0.35, 0.7)); pivot.add(m); flower.add(pivot);
    }
    if (!spike) {
      // sepals cupping the flower
      for (let i = 0; i < 5; i++) {
        const p = new THREE.Group(); p.position.copy(top); p.rotation.y = i / 5 * 6.2832;
        const m = new THREE.Mesh(petalGeo({ len: 0.16, wid: 0.07, cup: 0.2, point: 1, colors: ['#2f7a46', '#3f8f5a', '#5cbf74'] }, r, 6, 4), petalMat());
        m.rotation.x = 0.5; p.add(m); flower.add(p);
      }
    }
    const head = buildHead(f, r); head.position.copy(top);
    head.rotation.set(head.userData.face, r.range(0, 6.28), r.range(-0.08, 0.08));
    flower.add(head);
    flower.userData.height = headY + 1 + head.userData.extra;
    return flower;
  }

  /* ---------- the glass box ---------- */
  function buildCase(w, h, d) {
    const g = new THREE.Group();
    const wood = new THREE.MeshStandardMaterial({ color: '#2b1830', roughness: 0.4, metalness: 0.15 });
    const gold = new THREE.MeshStandardMaterial({ color: '#d8b45c', roughness: 0.28, metalness: 0.85 });
    const base = new THREE.Mesh(new THREE.BoxGeometry(w + 0.35, 0.3, d + 0.35), wood); base.position.y = -0.15; g.add(base);
    const trim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.42, 0.04, d + 0.42), gold); trim.position.y = -0.3; g.add(trim);
    const soil = new THREE.Mesh(new THREE.BoxGeometry(w - 0.06, 0.07, d - 0.06), new THREE.MeshStandardMaterial({ color: '#1f331c', roughness: 1 }));
    soil.position.y = 0.035; g.add(soil);
    const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshPhysicalMaterial({
      color: 0xffffff, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.1,
      side: THREE.DoubleSide, depthWrite: false, clearcoat: 1, clearcoatRoughness: 0.05
    }));
    glass.position.y = h / 2; glass.renderOrder = 5; g.add(glass);
    const t = 0.04, hw = w / 2, hd = d / 2;
    const bar = (sx, sy, sz, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), gold); m.position.set(x, y, z); g.add(m); };
    [[-hw, -hd], [hw, -hd], [-hw, hd], [hw, hd]].forEach(([x, z]) => bar(t, h, t, x, h / 2, z));
    [0, h].forEach(y => { bar(w + t, t, t, 0, y, -hd); bar(w + t, t, t, 0, y, hd); bar(t, t, d + t, -hw, y, 0); bar(t, t, d + t, hw, y, 0); });
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), gold); knob.position.y = h + 0.1; g.add(knob);
    const glareMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08, depthWrite: false, side: THREE.DoubleSide });
    [[-0.18, 0.18], [0.12, 0.07]].forEach(([x, wd]) => {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(w * wd, h * 0.9), glareMat);
      p.position.set(x * w, h / 2, hd + 0.002); p.rotation.z = 0.18; p.renderOrder = 6; g.add(p);
    });
    const n = Math.round(45 * (w * d) / 6), arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[i * 3] = (Math.random() - .5) * (w - 0.2); arr[i * 3 + 1] = Math.random() * h; arr[i * 3 + 2] = (Math.random() - .5) * (d - 0.2); }
    const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    const sparkles = new THREE.Points(sg, new THREE.PointsMaterial({ color: '#ffe3f1', size: 0.05, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
    sparkles.userData.h = h; g.add(sparkles);
    g.userData = { sparkles, size: { w: Math.max(w, d) + 0.6, h: h + 0.2 } };
    return g;
  }

  function buildDisplay(keys) {
    const root = new THREE.Group();
    if (keys.length === 1) {
      const fl = buildFlower(describe(keys[0]), keys[0]);
      const c = buildCase(2.5, Math.max(3.2, fl.userData.height + 0.3), 2.5);
      root.add(c); root.add(fl); root.userData = c.userData; return root;
    }
    const n = keys.length, cols = Math.ceil(Math.sqrt(n * 1.4)), rows = Math.ceil(n / cols), gap = 1.15, sc = 0.55;
    let maxH = 0;
    keys.forEach((k, i) => {
      const fl = buildFlower(describe(k), k); fl.scale.setScalar(sc);
      fl.position.set((i % cols - (cols - 1) / 2) * gap, 0, (Math.floor(i / cols) - (rows - 1) / 2) * gap);
      maxH = Math.max(maxH, fl.userData.height * sc); root.add(fl);
    });
    const c = buildCase(cols * gap + 0.3, Math.max(2.0, maxH + 0.25), rows * gap + 0.3); root.add(c); root.userData = c.userData;
    return root;
  }
  function disposeTree(o) {
    o.traverse(m => {
      if (m.geometry) m.geometry.dispose();
      if (m.material) (Array.isArray(m.material) ? m.material : [m.material]).forEach(mt => { if (mt.map) mt.map.dispose(); mt.dispose(); });
    });
  }
  function addLights(scene) {
    scene.add(new THREE.AmbientLight(0xffffff, 0.16));
    scene.add(new THREE.HemisphereLight(0xffeef6, 0x2a1530, 0.5));
    const key = new THREE.DirectionalLight(0xfff4ea, 0.85); key.position.set(3, 6, 5); scene.add(key);
    const rim = new THREE.DirectionalLight(0xc4b5fd, 0.6); rim.position.set(-5, 3, -4); scene.add(rim);
    const warm = new THREE.PointLight(0xffc2dd, 0.55, 14); warm.position.set(0, 3, 2); scene.add(warm);
  }

  /* ================= viewer ================= */
  const canvas = document.getElementById('view'), stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene(); addLights(scene);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
  const turntable = new THREE.Group(); scene.add(turntable);
  let display = null;

  function fit() {
    const W = stage.clientWidth, H = stage.clientHeight;
    renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
    if (!display) return;
    const { w, h } = display.userData.size, tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const dist = Math.max((h + 0.6) / (2 * tan), (w * 1.1) / (2 * tan * camera.aspect)) * 1.08 + w / 2;
    camera.position.set(0, h * 0.5 + dist * 0.2, dist);
    camera.lookAt(0, h * 0.44, 0);
  }
  function show(keys) {
    if (display) { turntable.remove(display); disposeTree(display); }
    display = buildDisplay(keys); turntable.add(display); fit();
  }

  let rotY = 0.6, rotX = 0.04, velY = 0, dragging = false, lastX = 0, lastY = 0, lastMove = 0;
  stage.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; stage.setPointerCapture(e.pointerId); document.getElementById('hint').style.opacity = 0; });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    velY = dx * 0.008; rotY += velY; rotX = Math.max(-0.2, Math.min(0.5, rotX + dy * 0.004)); lastMove = performance.now();
  });
  const end = () => { dragging = false; };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);

  const clock = new THREE.Clock();
  function loop() {
    const dt = Math.min(0.05, clock.getDelta());
    if (!dragging) { velY *= 0.95; rotY += velY; if (performance.now() - lastMove > 2500) rotY += dt * 0.22; }
    turntable.rotation.y = rotY; turntable.rotation.x = rotX;
    const sp = display && display.userData.sparkles;
    if (sp) { const a = sp.geometry.attributes.position, h = sp.userData.h; for (let i = 0; i < a.count; i++) { let y = a.getY(i) + dt * 0.12; if (y > h) y = 0; a.setY(i, y); } a.needsUpdate = true; }
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  /* ---------- diary thumbnails ---------- */
  let thumbR = null, thumbScene, thumbCam;
  function thumbnail(key) {
    if (!thumbR) {
      thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      thumbR.setPixelRatio(1); thumbR.setSize(250, 300);
      thumbScene = new THREE.Scene(); addLights(thumbScene);
      thumbCam = new THREE.PerspectiveCamera(30, 250 / 300, 0.1, 100);
    }
    const d = buildDisplay([key]); d.rotation.y = 0.6; thumbScene.add(d);
    const h = d.userData.size.h; thumbCam.position.set(0, h * 0.6, 7.4); thumbCam.lookAt(0, h * 0.45, 0);
    thumbR.render(thumbScene, thumbCam);
    const url = thumbR.domElement.toDataURL('image/png');
    thumbScene.remove(d); disposeTree(d);
    return url;
  }

  /* ================= page ================= */
  const $ = id => document.getElementById(id);
  const tabOne = $('tabOne'), tabAll = $('tabAll'), grid = $('grid');
  let current = keyOf(today()), mode = 'one';

  function selectDay(key) {
    mode = 'one'; current = key;
    tabOne.classList.add('on'); tabAll.classList.remove('on');
    const f = describe(key), d = fromKey(key), isToday = key === keyOf(today());
    tabOne.textContent = isToday ? "Today's flower" : "This day's flower";
    $('title').textContent = isToday ? 'Flower of the day' : 'From the diary';
    $('date').textContent = longDate(d);
    $('meta').textContent = `Day ${dayNumber(d)}`;
    $('fname').textContent = f.name;
    $('meaning').textContent = f.meaning;
    $('note').textContent = f.note;
    $('quote').textContent = f.quote;
    $('by').textContent = f.by;
    $('card').classList.remove('garden');
    document.querySelectorAll('.card-day').forEach(c => c.classList.toggle('sel', c.dataset.key === key));
    show([key]);
  }
  function showAll() {
    mode = 'all';
    tabAll.classList.add('on'); tabOne.classList.remove('on');
    const keys = allDays();
    $('title').textContent = 'The whole garden';
    $('date').textContent = `${keys.length} flower${keys.length > 1 ? 's' : ''} so far, since ${shortDate(fromKey(keys[0]))}`;
    $('meta').textContent = 'every day, kept together';
    $('fname').textContent = 'Your glass garden';
    $('meaning').textContent = 'A new flower joins every day';
    $('note').textContent = 'Turn it around and find them all.';
    $('quote').textContent = ''; $('by').textContent = '';
    $('card').classList.add('garden');
    show(keys.slice(-40));
  }
  tabOne.addEventListener('click', () => selectDay(current));
  tabAll.addEventListener('click', showAll);

  function buildDiary() {
    grid.innerHTML = '';
    const keys = allDays().reverse(), tKey = keyOf(today()), t = today(), tom = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1);
    const lock = document.createElement('div'); lock.className = 'card-day locked';
    lock.innerHTML = `<div class="img">🔒</div><div class="d">${shortDate(tom)}</div><div class="n">blooms tomorrow</div>`;
    grid.appendChild(lock);
    const pending = [];
    keys.forEach(k => {
      const f = describe(k), b = document.createElement('button');
      b.className = 'card-day' + (k === current ? ' sel' : ''); b.dataset.key = k;
      b.innerHTML = `<div class="img"></div><div class="d"></div><div class="n"></div>`;
      b.querySelector('.d').textContent = `${k === tKey ? 'Today' : shortDate(fromKey(k))} · Day ${dayNumber(fromKey(k))}`;
      b.querySelector('.n').textContent = f.name;
      b.addEventListener('click', () => { selectDay(k); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      grid.appendChild(b); pending.push([k, b.querySelector('.img')]);
    });
    (function drawSome() {
      pending.splice(0, 2).forEach(([k, el]) => { try { el.style.backgroundImage = `url(${thumbnail(k)})`; } catch (e) {} });
      if (pending.length) setTimeout(drawSome, 60);
    })();
  }
  function tick() {
    const now = new Date(), t = today(), next = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1);
    const s = Math.max(0, Math.floor((next - now) / 1000));
    $('next').innerHTML = `next flower blooms in <b>${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}</b>`;
    if (s === 0) setTimeout(() => { current = keyOf(today()); buildDiary(); if (mode === 'one') selectDay(current); }, 1500);
  }

  $('loading').remove();
  selectDay(current); buildDiary();
  tick(); setInterval(tick, 1000);
  new ResizeObserver(fit).observe(stage);
  loop();
})();
</script>
</body>
</html>
