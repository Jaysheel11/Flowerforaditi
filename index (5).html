<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Aditi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f6e3ea; --soft: #c3a2b6; --pink: #ff9fc0; --lilac: #c9a3ff;
    --card: rgba(255, 255, 255, .06); --line: rgba(255, 255, 255, .16);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--ink);
    background: radial-gradient(ellipse at 50% 0%, #2a1530 0%, #140a18 50%, #08040b 100%) fixed;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    overflow-x: hidden; -webkit-tap-highlight-color: transparent;
  }
  body.locked { overflow: hidden; }
  #sky, #petals { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #sky { z-index: 0; }
  #petals { z-index: 6; }
  main { position: relative; z-index: 1; }
  section { min-height: 100vh; padding: calc(4vh + env(safe-area-inset-top, 0px)) 1.2rem 4vh; }
  h2 { font-style: italic; font-weight: 500; font-size: clamp(2rem, 6vw, 3.2rem); margin: 0; text-align: center; }
  .sub { font-style: italic; color: var(--soft); text-align: center; margin: .4rem 0 0; font-size: 1.1rem; }

  /* ---------- intro ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at 50% 40%, #2a1530 0%, #0b060e 75%);
    transition: opacity 1.4s ease, visibility 1.4s;
  }
  #intro.gone { opacity: 0; visibility: hidden; }
  #intro .small { font-style: italic; color: var(--soft); font-size: 1.3rem; margin: 0; }
  #intro h1 { font-style: italic; font-weight: 500; font-size: clamp(3.5rem, 14vw, 7rem); margin: 0 0 1.6rem; line-height: 1;
    background: linear-gradient(90deg, #ffd6e7, #fff, #d8b4fe); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill {
    font: italic 500 1.25rem "Cormorant Garamond", Georgia, serif; color: var(--ink);
    background: linear-gradient(90deg, rgba(255,159,192,.18), rgba(201,163,255,.18));
    border: 1px solid var(--line); border-radius: 999px; padding: .6rem 1.8rem; cursor: pointer;
    animation: breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe { 50% { box-shadow: 0 0 28px rgba(255,159,192,.35); } }
  #intro .hint { margin-top: 1rem; color: var(--soft); font-size: .95rem; font-style: italic; }

  /* ---------- hero: big half-screen video + bouquet ---------- */
  .hero { position: relative; padding: 0; min-height: 100vh; }
  .vhalf {
    position: absolute; left: 0; top: 0; width: 100%; height: 64vh; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 80%, transparent 100%);
  }
  .vhalf video { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
  .bside { position: relative; padding-top: 58vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 7vh; }
  #bouquet { width: min(100%, 560px); height: 50vh; cursor: pointer; display: block; }
  .bmsg { text-align: center; min-height: 5.5rem; opacity: 0; transition: opacity 2.2s ease; padding: 0 1rem; }
  .bmsg.show { opacity: 1; }
  .bmsg h1 { font-style: italic; font-weight: 500; font-size: clamp(1.6rem, 5vw, 2.5rem); margin: 0; }
  .bmsg p { font-style: italic; color: var(--soft); margin: .3rem 0 0; }
  @media (min-aspect-ratio: 1/1) {
    .vhalf { width: 50vw; height: 100%;
      -webkit-mask-image: linear-gradient(to right, #000 80%, transparent 100%);
              mask-image: linear-gradient(to right, #000 80%, transparent 100%); }
    .bside { padding: 0; margin-left: 50vw; width: 50vw; min-height: 100vh; justify-content: center; }
    #bouquet { width: 100%; height: 72vh; }
  }
  .scroll { position: absolute; left: 0; right: 0; bottom: calc(1.5vh + env(safe-area-inset-bottom, 0px));
    text-align: center; color: var(--soft); font-style: italic; animation: bob 2.4s ease-in-out infinite; }
  @media (min-aspect-ratio: 1/1) { .scroll { left: 50vw; } }
  @keyframes bob { 50% { transform: translateY(6px); } }

  /* ---------- garden ---------- */
  .garden { display: flex; flex-direction: column; }
  #garden { flex: 1; width: 100%; min-height: 70vh; margin-top: 1rem; display: block; cursor: crosshair;
    border-radius: 24px; background: linear-gradient(to bottom, transparent 60%, rgba(63, 143, 90, .12)); }

  /* ---------- notes ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; max-width: 960px; margin: 2rem auto 0; }
  .note { perspective: 900px; height: 190px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: inherit; }
  .note .in { position: relative; width: 100%; height: 100%; transition: transform .9s cubic-bezier(.3,.8,.3,1); transform-style: preserve-3d; }
  .note.flip .in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 20px; display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 1.2rem; text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 1px solid var(--line); }
  .front { background: linear-gradient(135deg, rgba(255,159,192,.16), rgba(201,163,255,.12)); font-size: 2.4rem; }
  .front span { font-size: 1rem; font-style: italic; color: var(--soft); margin-top: .4rem; }
  .back { transform: rotateY(180deg); background: linear-gradient(135deg, rgba(255,255,255,.1), rgba(201,163,255,.16));
    font-family: "Caveat", "Segoe Print", cursive; font-size: 1.7rem; line-height: 1.25; }

  /* ---------- end ---------- */
  .end { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .end h2 { background: linear-gradient(90deg, #ffd6e7, #fff, #d8b4fe); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .end .pill { margin-top: 1.6rem; }

  .sound {
    position: fixed; z-index: 7; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
    font: italic 500 1rem "Cormorant Garamond", Georgia, serif; color: #fff;
    background: rgba(20, 8, 24, .5); border: 1px solid var(--line); border-radius: 999px;
    padding: .35rem 1rem; cursor: pointer; backdrop-filter: blur(6px); display: none;
  }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 1.2s ease, transform 1.2s ease; }
  .reveal.in { opacity: 1; transform: none; }
</style>
</head>
<body class="locked">
<canvas id="sky"></canvas>
<canvas id="petals"></canvas>

<div id="intro">
  <div>
    <p class="small">something for</p>
    <h1 id="introName">Aditi</h1>
    <button class="pill" id="open">open 🌷</button>
    <p class="hint">turn your sound on 🎵</p>
  </div>
</div>

<button class="sound" id="sound">🎵 music on</button>

<main>
  <section class="hero" id="top">
    <div class="vhalf"><video id="vid" muted loop playsinline autoplay preload="auto"></video></div>
    <div class="bside">
      <canvas id="bouquet" aria-label="Tap for a new bouquet"></canvas>
      <div class="bmsg" id="bmsg"><h1 id="btitle"></h1><p>tap the flowers for a new bunch</p></div>
    </div>
    <div class="scroll">scroll ↓</div>
  </section>

  <section class="garden">
    <div class="reveal">
      <h2>A little garden for you</h2>
      <p class="sub">tap anywhere to plant a flower</p>
    </div>
    <canvas id="garden" aria-label="Tap to plant a flower"></canvas>
  </section>

  <section>
    <div class="reveal">
      <h2>A few little things</h2>
      <p class="sub">tap a card</p>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="end">
    <div class="reveal">
      <h2 id="endLine"></h2>
      <p class="sub">every flower on this page is yours</p>
      <button class="pill" id="again">one more bouquet 🌸</button>
    </div>
  </section>
</main>

    } else if (shape === 'heart') {
      o.moveTo(0, 0);
      o.bezierCurveTo(len * 0.3, -wid * 0.9, len * 1.05, -wid * 0.8, len * 0.88, 0);
      o.bezierCurveTo(len * 1.05, wid * 0.8, len * 0.3, wid * 0.9, 0, 0);
    } else o.ellipse(len * 0.55, 0, len * 0.55, wid / 4, 0, 0, Math.PI * 2);
  }
  function drawRandomFlower(o, cx, cy, s) {
    const pal = pick(PALETTES), shape = pick(SHAPES);
    const n = Math.floor(rand(5, shape === 'thin' ? 22 : 13)), rings = Math.floor(rand(1, 4));
    const baseLen = rand(85, 120), baseWid = shape === 'thin' ? rand(30, 40) : rand(35, 55), spin = rand(0, 6.28);
    for (let r = 0; r < rings; r++) {
      const f = 1 - r * 0.28, len = baseLen * f * s, wid = baseWid * f * s;
      for (let i = 0; i < n; i++) {
        o.save(); o.translate(cx, cy); o.rotate((i / n) * Math.PI * 2 + spin + r * (Math.PI / n) + rand(-0.06, 0.06));
        const g = o.createLinearGradient(0, 0, len, 0);
        if (r % 2 === 0) { g.addColorStop(0, pal[0]); g.addColorStop(0.6, pal[1]); g.addColorStop(1, '#ffffff'); }
        else { g.addColorStop(0, pal[1]); g.addColorStop(1, pal[0]); }
        o.fillStyle = g; petalPath(o, len * rand(0.92, 1.05), wid, shape); o.fill(); o.restore();
      }
    }
    const cr = rand(16, 30) * s, cg = o.createRadialGradient(cx, cy, 0, cx, cy, cr);
    cg.addColorStop(0, '#fff6d0'); cg.addColorStop(1, pal[2]);
    o.fillStyle = cg; o.beginPath(); o.arc(cx, cy, cr, 0, Math.PI * 2); o.fill();
  }
  function drawTulip(o, cx, cy, s) {
    const [dark, light] = pick(TULIP_PALETTES), w = rand(95, 115) * s, h = rand(115, 140) * s;
    o.save(); o.translate(cx, cy); o.rotate(rand(-0.15, 0.15));
    o.fillStyle = dark; o.beginPath();
    o.moveTo(-w * 0.45, h * 0.15); o.quadraticCurveTo(-w * 0.25, -h * 0.75, 0, -h * 0.62);
    o.quadraticCurveTo(w * 0.25, -h * 0.75, w * 0.45, h * 0.15); o.closePath(); o.fill();
    [-1, 1].forEach(d => {
      const g = o.createLinearGradient(0, h * 0.45, d * w * 0.5, -h * 0.6);
      g.addColorStop(0, dark); g.addColorStop(1, light); o.fillStyle = g;
      o.beginPath(); o.moveTo(0, h * 0.45); o.quadraticCurveTo(d * w * 0.75, h * 0.3, d * w * 0.5, -h * 0.55);
      o.quadraticCurveTo(d * w * 0.1, -h * 0.15, 0, h * 0.45); o.fill();
    });
    const g = o.createLinearGradient(0, h * 0.45, 0, -h * 0.7);
    g.addColorStop(0, dark); g.addColorStop(0.7, light); g.addColorStop(1, '#ffffff'); o.fillStyle = g;
    o.beginPath(); o.moveTo(-w * 0.38, h * 0.3); o.quadraticCurveTo(-w * 0.42, -h * 0.45, 0, -h * 0.72);
    o.quadraticCurveTo(w * 0.42, -h * 0.45, w * 0.38, h * 0.3); o.quadraticCurveTo(0, h * 0.55, -w * 0.38, h * 0.3); o.fill();
    o.restore();
  }
  function drawSunflower(o, cx, cy, s) {
    const Rr = rand(36, 46) * s, n = Math.floor(rand(18, 26)), len = rand(55, 72) * s, wid = rand(20, 26) * s, spin = rand(0, 6.28);
    [['#e09b00', 0], ['#ffd23f', Math.PI / n]].forEach(([col, off], ring) => {
      for (let i = 0; i < n; i++) {
        o.save(); o.translate(cx, cy); o.rotate((i / n) * Math.PI * 2 + spin + off + rand(-0.05, 0.05)); o.translate(Rr * 0.75, 0);
        const g = o.createLinearGradient(0, 0, len, 0); g.addColorStop(0, col); g.addColorStop(1, '#fff1a8');
        o.fillStyle = g; petalPath(o, len * (ring ? 0.88 : 1) * rand(0.9, 1.08), wid, 'pointed'); o.fill(); o.restore();
      }
    });
    o.fillStyle = '#4a2a0e'; o.beginPath(); o.arc(cx, cy, Rr, 0, Math.PI * 2); o.fill();
    for (let i = 0; i < 260; i++) {
      const r = Rr * 0.95 * Math.sqrt(i / 260), a = i * 2.39996;
      o.fillStyle = i % 3 ? '#7a4a1a' : '#2c1606';
      o.beginPath(); o.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 1.6 * s + 0.6, 0, Math.PI * 2); o.fill();
    }
  }
  function drawLavender(o, x0, y0, x1, y1, s) {
    o.strokeStyle = '#4c8f5c'; o.lineWidth = 4 * s; o.lineCap = 'round';
    o.beginPath(); o.moveTo(x0, y0); o.quadraticCurveTo((x0 + x1) / 2 + rand(-20, 20) * s, (y0 + y1) / 2, x1, y1); o.stroke();
    const ang = Math.atan2(y0 - y1, x0 - x1);
    for (let i = 0; i < 14; i++) {
      const t = i / 14, bx = x0 + (x1 - x0) * t * 0.35, by = y0 + (y1 - y0) * t * 0.35, sz = (1 - t * 0.5) * 14 * s;
      [-1, 1].forEach(d => {
        o.save(); o.translate(bx + d * sz * 0.6 * Math.sin(ang), by); o.rotate(ang + d * 0.5);
        const g = o.createLinearGradient(-sz, 0, sz, 0); g.addColorStop(0, '#7b2cbf'); g.addColorStop(1, '#d8b4fe');
        o.fillStyle = g; o.beginPath(); o.ellipse(0, 0, sz, sz * 0.55, 0, 0, Math.PI * 2); o.fill(); o.restore();
      });
    }
  }
  function drawStem(o, x0, y0, x1, y1, s, type) {
    const bend = rand(-35, 35) * s;
    o.strokeStyle = '#3f8f5a'; o.lineWidth = Math.max(2, (type === 'sunflower' ? 11 : 8) * s); o.lineCap = 'round';
    o.beginPath(); o.moveTo(x0, y0);
    o.bezierCurveTo(x0 + bend, y0 + (y1 - y0) * 0.4, x1 - bend, y0 + (y1 - y0) * 0.7, x1, y1); o.stroke();
    o.fillStyle = pick(['#4fae6c', '#5cbf74', '#3e9e5e']);
    const leaves = type === 'tulip' ? 2 : Math.floor(rand(1, 3));
    for (let i = 0; i < leaves; i++) {
      const t = rand(0.45, 0.85), lx = x0 + (x1 - x0) * t, ly = y0 + (y1 - y0) * t, d = i % 2 ? 1 : -1;
      o.save(); o.translate(lx, ly);
      if (type === 'tulip') {
        o.rotate(d * rand(0.25, 0.45)); o.beginPath(); o.moveTo(0, 0);
        o.quadraticCurveTo(d * 30 * s, -60 * s, d * 8 * s, -130 * s); o.quadraticCurveTo(d * 2 * s, -50 * s, 0, 0); o.fill();
      } else {
        o.rotate(d * rand(-0.9, -0.4)); o.beginPath();
        o.ellipse(d * 40 * s, 0, rand(36, 52) * s, rand(12, 18) * s, 0, 0, Math.PI * 2); o.fill();
      }
      o.restore();
    }
  }
  const pickType = () => { const r = Math.random(); return r < 0.35 ? 'tulip' : r < 0.55 ? 'sunflower' : 'random'; };
  function drawHead(o, type, x, y, s) {
    if (type === 'tulip') drawTulip(o, x, y, s);
    else if (type === 'sunflower') drawSunflower(o, x, y, s);
    else drawRandomFlower(o, x, y, s);
  }
  function sample(W, H, drawFn, step) {
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const o = off.getContext('2d'); drawFn(o);
    const data = o.getImageData(0, 0, W, H).data, pts = [];
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
      const k = (y * W + x) * 4;
      if (data[k + 3] > 128) pts.push({ x, y, c: `rgb(${data[k]},${data[k + 1]},${data[k + 2]})` });
    }
    return pts;
  }

  /* ================= particle canvas ================= */
  class Field {
    constructor(cv) { this.cv = cv; this.ctx = cv.getContext('2d'); this.ps = []; this.visible = true; }
    resize() {
      const r = this.cv.getBoundingClientRect(); this.W = Math.round(r.width); this.H = Math.round(r.height);
      const d = DPR(); this.cv.width = this.W * d; this.cv.height = this.H * d; this.ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    draw(now) {
      if (!this.visible) return;
      const c = this.ctx; c.clearRect(0, 0, this.W, this.H);
      for (const p of this.ps) {
        if (now > p.at) { p.x += (p.tx - p.x) * p.sp; p.y += (p.ty - p.y) * p.sp; }
        else { p.x += Math.sin(now / 1200 + p.ph) * 0.3; p.y += Math.cos(now / 1400 + p.ph) * 0.3; }
        c.globalAlpha = now > p.at ? 1 : 0.5; c.fillStyle = p.c;
        c.beginPath(); c.arc(p.x + (reduce ? 0 : Math.sin(now / 1100 + p.ph) * 0.5), p.y, p.r, 0, 6.2832); c.fill();
      }
      c.globalAlpha = 1;
    }
  }

  /* ================= video + intro ================= */
  const vid = document.getElementById('vid');
  {
    const bin = atob(VIDEO_B64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    vid.src = URL.createObjectURL(new Blob([arr], { type: 'video/mp4' }));
  }
  vid.muted = true; vid.play().catch(() => {});

  /* ================= music: plays music.mp3 from the same folder ================= */
  const Music = (() => {
    const audio = new Audio(MUSIC_FILE);
    audio.loop = true; audio.preload = 'auto'; audio.volume = 0;
    let on = false, fade, ok = true;
    audio.addEventListener('error', () => { ok = false; soundBtn.style.visibility = 'hidden'; });
    function ramp(to, ms, done) {
      clearInterval(fade);
      const from = audio.volume, t0 = performance.now();
      fade = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        audio.volume = from + (to - from) * k;
        if (k === 1) { clearInterval(fade); done && done(); }
      }, 50);
    }
    return {
      start() { if (!ok) return; on = true; audio.play().then(() => ramp(MUSIC_VOLUME, 2500)).catch(() => {}); },
      stop() { on = false; ramp(0, 700, () => { if (!on) audio.pause(); }); },
      get on() { return on; }
    };
  })();
  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    if (Music.on) { Music.stop(); soundBtn.textContent = '🔇 music off'; }
    else { Music.start(); soundBtn.textContent = '🎵 music on'; }
  });

  document.getElementById('introName').textContent = NAMES[0];
  document.getElementById('open').addEventListener('click', () => {
    document.getElementById('intro').classList.add('gone');
    document.body.classList.remove('locked');
    soundBtn.style.display = 'block';
    vid.currentTime = 0; vid.play().catch(() => {});
    Music.start();
    newBouquet(false);
  });

  /* ================= messages ================= */
  let lastMsg = '', currentTypes = [];
  function makeMessage() {
    const hasT = currentTypes.includes('tulip'), hasS = currentTypes.includes('sunflower');
    let special = [];
    if (hasT && hasS) special = BOTH_MESSAGES.concat(TULIP_MESSAGES, SUNFLOWER_MESSAGES);
    else if (hasT) special = TULIP_MESSAGES; else if (hasS) special = SUNFLOWER_MESSAGES;
    const pool = special.length && Math.random() < 0.4 ? special : MESSAGES;
    let m, tries = 0;
    do { m = pick(pool).replace('{name}', pick(NAMES)); } while (m === lastMsg && ++tries < 10);
    return (lastMsg = m);
  }

  /* ================= bouquet ================= */
  const bouquet = new Field(document.getElementById('bouquet'));
  const bmsg = document.getElementById('bmsg'), btitle = document.getElementById('btitle');
  let msgTimer, opened = false;
  const LAYOUTS = {
    1: [[0, 0]], 2: [[-85, 0.04], [85, -0.04]], 3: [[-120, 0.06], [0, -0.06], [120, 0.06]],
    4: [[-150, 0.07], [-52, -0.05], [52, -0.07], [150, 0.05]],
    5: [[-160, 0.08], [-80, -0.04], [0, -0.1], [80, -0.04], [160, 0.08]]
  };
  function newBouquet(fromOld) {
    opened = true;
    const W = bouquet.W, H = bouquet.H, r = Math.random();
    const count = r < 0.2 ? 1 : r < 0.35 ? 2 : r < 0.65 ? 3 : r < 0.85 ? 4 : 5;
    const base = Math.min(W, H * 0.92) / 520;
    const s = base * (count === 1 ? 0.95 : count <= 3 ? 0.66 : 0.52);
    const gx = W / 2, gy = H * 0.95;
    const heads = LAYOUTS[count].map(([dx, dy]) => ({ x: gx + dx * base * (count >= 4 ? 0.85 : 1), y: H * (0.3 + dy), type: pickType() }));
    currentTypes = heads.map(h => h.type);
    const pts = sample(W, H, o => {
      if (count >= 2) [-1, 1].forEach(d => drawLavender(o, gx + d * rand(0.6, 1) * 200 * base, H * rand(0.28, 0.4), gx + d * 6 * base, gy, s));
      heads.forEach(h => drawStem(o, h.x, h.y + 30 * s, gx + rand(-10, 10) * base, gy, s, h.type));
      heads.forEach(h => drawHead(o, h.type, h.x, h.y, s));
    }, Math.max(3, Math.round(3.6 * base)));
    const size = Math.max(3, Math.round(3.6 * base)) * 0.45, now = performance.now();
    let maxD = 1; pts.forEach(p => { p.d = Math.hypot(p.x - gx, p.y - gy); if (p.d > maxD) maxD = p.d; });
    const old = bouquet.ps;
    bouquet.ps = pts.map((p, i) => {
      const o = old[i] && fromOld ? old[i] : null;
      const a = rand(0, 6.28), dist = rand(100, Math.max(W, H) * 0.7);
      return { tx: p.x, ty: p.y, c: p.c, r: size * rand(0.75, 1.25), ph: rand(0, 6.28), sp: rand(0.012, 0.022),
        x: o ? o.x + Math.cos(a) * dist * 0.5 : rand(-40, W + 40), y: o ? o.y + Math.sin(a) * dist * 0.5 : rand(-40, H + 40),
        at: now + (p.d / maxD) * 3500 + rand(0, 1800) };
    });
    if (reduce) bouquet.ps.forEach(p => { p.x = p.tx; p.y = p.ty; });
    bmsg.classList.remove('show'); clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { btitle.textContent = makeMessage(); bmsg.classList.add('show'); }, reduce ? 0 : 8000);
  }
  bouquet.cv.addEventListener('click', () => newBouquet(true));
  document.getElementById('again').addEventListener('click', () => {
    document.getElementById('top').scrollIntoView({ behavior: 'smooth' });
    setTimeout(() => newBouquet(true), 600);
  });

  /* ================= garden ================= */
  const garden = new Field(document.getElementById('garden'));
  let plants = [];
  function plant(x, y) {
    const W = garden.W, H = garden.H, base = Math.min(W, H) / 520;
    const s = base * rand(0.32, 0.48);
    y = Math.min(y, H - 90 * s - 30);
    const type = Math.random() < 0.15 ? 'lavender' : pickType();
    const gy = H - 6;
    const pts = sample(W, H, o => {
      if (type === 'lavender') drawLavender(o, x, y, x + rand(-15, 15) * s, gy, s * 1.4);
      else { drawStem(o, x, y + 25 * s, x + rand(-20, 20) * s, gy, s, type); drawHead(o, type, x, y, s); }
    }, 3);
    const now = performance.now();
    let maxD = 1; pts.forEach(p => { p.d = Math.hypot(p.x - x, p.y - gy); if (p.d > maxD) maxD = p.d; });
    const group = pts.map(p => ({ tx: p.x, ty: p.y, c: p.c, r: rand(1.1, 1.8), ph: rand(0, 6.28), sp: rand(0.03, 0.05),
      x: x + rand(-140, 140), y: y + rand(-140, 140), at: now + (p.d / maxD) * 700 + rand(0, 400) }));
    if (reduce) group.forEach(p => { p.x = p.tx; p.y = p.ty; });
    plants.push(group);
    if (plants.length > 16) plants.shift();
    garden.ps = plants.flat();
  }
  garden.cv.addEventListener('click', e => {
    const r = garden.cv.getBoundingClientRect(); plant(e.clientX - r.left, e.clientY - r.top);
  });

  /* ================= notes ================= */
  const grid = document.getElementById('grid');
  const icons = ['🌷', '🌻', '🌸', '💜', '🌙', '✨'];
  NOTES.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'note reveal';
    b.innerHTML = `<div class="in"><div class="face front">${icons[i % icons.length]}<span>tap me</span></div><div class="face back"></div></div>`;
    b.querySelector('.back').textContent = t;
    b.addEventListener('click', () => b.classList.toggle('flip'));
    grid.appendChild(b);
  });
  document.getElementById('endLine').textContent = END_LINE.replace('{name}', NAMES[0]);

  /* ================= sky + falling petals ================= */
  const sky = document.getElementById('sky'), sctx = sky.getContext('2d');
  const pc = document.getElementById('petals'), pctx = pc.getContext('2d');
  let VW, VH, stars = [], petals = [];
  const PETAL_COLS = ['#ffd6e7', '#ffffff', '#e9d5ff', '#f9a8d4', '#c084fc'];
  const makePetal = top => ({ x: rand(0, VW), y: top ? -20 : rand(0, VH), vy: rand(0.25, 0.7), vx: rand(-0.3, 0.3),
    rot: rand(0, 6.28), vr: rand(-0.02, 0.02), sz: rand(4, 8), c: pick(PETAL_COLS), ph: rand(0, 6.28) });
  function sizeViewport() {
    VW = window.innerWidth; VH = window.innerHeight; const d = DPR();
    [[sky, sctx], [pc, pctx]].forEach(([cv, c]) => { cv.width = VW * d; cv.height = VH * d; c.setTransform(d, 0, 0, d, 0, 0); });
    stars = Array.from({ length: Math.round(VW * VH / 5000) }, () => ({ x: rand(0, VW), y: rand(0, VH), r: rand(0.4, 1.4), ph: rand(0, 6.28), sp: rand(0.6, 1.8) }));
    petals = reduce ? [] : Array.from({ length: 22 }, () => makePetal(false));
  }

  /* ================= visibility + reveal ================= */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.target === bouquet.cv) bouquet.visible = e.isIntersecting;
    else if (e.target === garden.cv) garden.visible = e.isIntersecting;
    else if (e.isIntersecting) e.target.classList.add('in');
  }), { threshold: 0.05 });
  [bouquet.cv, garden.cv, ...document.querySelectorAll('.reveal')].forEach(el => io.observe(el));

  /* ================= loop ================= */
  function frame(now) {
    sctx.clearRect(0, 0, VW, VH);
    sctx.fillStyle = '#fff';
    for (const st of stars) {
      sctx.globalAlpha = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(now / 1000 * st.sp + st.ph));
      sctx.beginPath(); sctx.arc(st.x, st.y, st.r, 0, 6.2832); sctx.fill();
    }
    pctx.clearRect(0, 0, VW, VH); pctx.globalAlpha = 0.65;
    for (const p of petals) {
      p.y += p.vy; p.x += p.vx + Math.sin(now / 1500 + p.ph) * 0.3; p.rot += p.vr;
      if (p.y > VH + 20) Object.assign(p, makePetal(true));
      pctx.save(); pctx.translate(p.x, p.y); pctx.rotate(p.rot); pctx.fillStyle = p.c;
      pctx.beginPath(); pctx.ellipse(0, 0, p.sz, p.sz * 0.55, 0, 0, 6.2832); pctx.fill(); pctx.restore();
    }
    bouquet.draw(now); garden.draw(now);
    requestAnimationFrame(frame);
  }

  function layout() {
    sizeViewport(); bouquet.resize(); garden.resize();
    if (opened) newBouquet(false);
    plants = []; garden.ps = [];
    [0.2, 0.5, 0.8].forEach((f, i) => setTimeout(() => plant(garden.W * f, garden.H * rand(0.35, 0.55)), 400 + i * 350));
  }
  let rt, lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; layout(); } }, 250);
  });
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
